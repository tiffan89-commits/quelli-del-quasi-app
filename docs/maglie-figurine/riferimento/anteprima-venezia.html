<style>
@font-face{font-family:'Barlow Condensed';src:local('DejaVu Sans Condensed Bold');font-weight:700 800}
*{box-sizing:border-box}
body{margin:0;background:#0f1b17;color:#f6f3e7;font-family:'Inter',sans-serif;width:390px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 0}
.tabs b{padding:14px;text-align:center;font-weight:500;font-size:16px;border:1px solid #2b3c32;color:#c9d1c6}
.tabs b.on{background:#cdb983;color:#1b1a14;border-color:#cdb983}
.head{display:flex;justify-content:space-between;align-items:baseline;padding:22px 16px 12px}
.head h1{margin:0;font:800 30px 'Barlow Condensed',sans-serif}
.head span{color:#7fb2d6;font:600 18px 'Barlow Condensed',sans-serif;letter-spacing:.06em}
.pitch{margin:0 16px;border-radius:20px;border:1px solid #3a5a44;background:linear-gradient(#2a5a3e,#244f37);padding:12px 10px 16px;position:relative;overflow:hidden}
.pitch:before{content:"";position:absolute;inset:12px;border:1px solid #ffffff2e;border-radius:4px}
.pitch:after{content:"";position:absolute;left:50%;top:42%;width:110px;height:110px;margin-left:-55px;border:1px solid #ffffff26;border-radius:50%}
.row{display:flex;justify-content:space-around;margin:14px 0;position:relative;z-index:1}
.pl{display:flex;flex-direction:column;align-items:center;gap:5px;width:66px}
.fig{position:relative;width:76px;height:72px;display:flex;align-items:center;justify-content:center}

.fig svg{flex:none;width:76px;height:76px;filter:drop-shadow(0 4px 4px #0009)}
.pct{margin-top:-4px;font:700 11px 'Inter',sans-serif;color:#fff;background:#0c1815;border:1.5px solid #f6f3e7;border-radius:999px;padding:2px 7px}
.pct.warn{color:#f2c230;border-color:#f2c230}
.row-5 .pl{width:64px}.row-5 .fig{width:64px;height:64px}.row-5 .fig svg{width:66px;height:66px}
.nm{font-size:12.5px;color:#f6f3e7;white-space:nowrap;text-shadow:0 1px 2px #000}
.box{margin:18px 16px 0;border:1px solid #2b3c32;border-radius:16px;padding:16px}
.box h3{margin:0;color:#7fb2d6;font-size:17px}
.ball{display:flex;align-items:center;gap:16px;margin-top:14px}
.ball .duel{display:flex;gap:10px}
.mini{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.mini .fig{width:56px;height:66px}.mini .fig svg{width:58px;height:58px}
.ball ul{list-style:none;margin:0;padding:0;flex:1}.ball li{display:flex;justify-content:space-between;padding:4px 0}
.foot{color:#9ba99e;font-size:12px;padding:16px}

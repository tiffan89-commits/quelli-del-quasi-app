<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="Voti spiegati"><rect width="1080" height="1920" fill="#0c1815"/><path d="M0 460 1080 300v550L0 1010Z" fill="#193326" opacity=".55"/><g font-family="Arial, sans-serif" fill="#f6f3e7"><text x="85" y="282" font-size="28" font-weight="700" letter-spacing="5">QUELLI DEL QUASI.</text><text x="85" y="450" font-size="112" font-weight="900" letter-spacing="-4">SEI E MEZZO.</text><text x="85" y="572" font-size="112" font-weight="900" letter-spacing="-4">MA PERCHÉ?</text><text x="88" y="638" font-size="47" font-weight="700" fill="#d6f77b">IL FANTA CHE TI SPIEGA IL VOTO.</text><rect x="85" y="715" width="910" height="330" rx="25" fill="#1c3429" stroke="#40533c"/><text x="125" y="780" font-size="24" fill="#d6f77b">VOTI SPIEGATI · ESEMPIO ILLUSTRATIVO</text><text x="130" y="915" font-size="120" font-weight="900" fill="#d6f77b">6,5</text><text x="390" y="855" font-size="34">Il voto nasce dai dati.</text><text x="390" y="915" font-size="30" fill="#b0bfb3">La spiegazione è lì,</text><text x="390" y="960" font-size="30" fill="#b0bfb3">accanto alla prestazione.</text><rect x="85" y="1605" width="910" height="110" rx="10" fill="#d6f77b"/><text x="130" y="1675" font-size="43" font-weight="700" fill="#142014">PRENDI UNA SQUADRA</text><path d="M877 1670h48m-20-20 20 20-20 20" fill="none" stroke="#142014" stroke-width="6"/><text x="85" y="1780" font-size="26">Niente pubblicità, per sempre.</text><text x="85" y="1832" font-size="22" fill="#b0bfb3">Lega di prova · Posti soggetti a disponibilità</text></g></svg>